# Repo overlay for the self-heal kit (tools/self-heal). Merged over tools/self-heal/defaults.yml.
# Loaded from the DEFAULT BRANCH at run time: edits take effect once merged.

agent:
  context_files:
    - .github/self-heal/context.md
  allowed_bots: "romanenko-ci-doctor[bot]"   # the self-heal GitHub App (its pushes re-trigger CI)
  # Strategy swap example (no workflow edits):
  #   plugins: [superpowers@claude-plugins-official]
  #   method_skills: [superpowers:systematic-debugging, superpowers:verification-before-completion]

runtime:
  node: "22"
  setup:
    - npm ci
    - node scripts/ci/install-native-binaries.cjs

guard:
  protected_paths:          # appended to the kit's safety floor, for every route
    - '^migrations/'
    - '(^|/)wrangler\.toml$'
    - '^scripts/ci/'
    - '(^|/)tsconfig[^/]*\.json$'      # typecheck scope is a human decision
    - '(^|/)vitest\.config\.[cm]?[jt]s$'

routes:
  tests:
    commands:               # exactly what the unit-tests CI job runs
      - npm run test
      - npm run typecheck
    allowed_tools:
      - Bash(npm run test:*)
      - Bash(npm test:*)
      - Bash(npx vitest:*)
      - Bash(node --test:*)
      - Bash(npm run typecheck:*)
      - Bash(npx tsc:*)
    # A real regression with a confident fixer AND judge is committed; anything else is proposed.
    apply: auto
  build:
    commands:
      - npm run build
    allowed_tools:
      - Bash(npm run build:*)
      - Bash(npx astro build:*)
    protected_paths:        # build config is a human decision (heal-build classifies it `environment`)
      - '(^|/)astro\.config\.[cm]?[jt]s$'
    apply: propose

migrations:
  enabled: true
  adapter: d1
  dir: migrations
  allowed_tools:
    - Bash(npx wrangler d1 execute blog-db --local:*)
  d1:
    database: blog-db
