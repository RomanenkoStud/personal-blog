# Reusable: heal a failing pull request. One entry point for every CI job; a deterministic
# router (tools/self-heal/bin/heal.mjs) maps the failed job to a route (tests, build, …),
# each with its own skill, commands, tools and apply policy. Generic — all repo specifics
# come from <policy_dir>/config.yml (merged over tools/self-heal/defaults.yml).
#
# Trust model: policy (kit scripts, skills, config) is loaded from `policy_ref`
# (default: the repo's default branch); only the code under repair comes from the PR.
# The route — and so the fixer's permissions — is chosen from job results, never by an LLM.
name: self-heal

on:
  workflow_call:
    inputs:
      needs:
        description: toJSON(needs) of the calling job — which CI jobs failed
        type: string
        required: true
      policy_dir:
        description: Directory holding config.yml and context files
        type: string
        default: .github/self-heal
      kit_path:
        description: Path of the self-heal kit inside the policy checkout
        type: string
        default: tools/self-heal
      policy_ref:
        description: Ref to load policy from (default = default branch). Override only to bootstrap/test.
        type: string
        default: ''

jobs:
  heal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      KIT: ${{ github.workspace }}/.self-heal-policy/${{ inputs.kit_path }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # No GH_TOKEN at job level: setup, reproduce, fix and verify run PR/agent code without it.
    steps:
      - name: Checkout PR head (code under repair)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false   # no push token on disk while the agent runs

      - name: Checkout policy (trusted ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.policy_ref || github.event.repository.default_branch }}
          path: .self-heal-policy
          sparse-checkout: |
            ${{ inputs.kit_path }}
            ${{ inputs.policy_dir }}
          persist-credentials: false

      - name: Resolve config
        id: cfg
        run: |
          printf '.heal/\n.self-heal-policy/\n.claude-pr/\n' >> .git/info/exclude
          rm -rf .heal && mkdir -p .heal
          # Context files are read from the policy checkout so a PR can't rewrite them.
          node "$KIT/bin/load-config.mjs" "$KIT/defaults.yml" ".self-heal-policy/${{ inputs.policy_dir }}/config.yml" > .heal/config.json
          echo "json=$(cat .heal/config.json)" >> "$GITHUB_OUTPUT"

      - name: Route
        id: route
        env:
          NEEDS: ${{ inputs.needs }}
        run: |
          node "$KIT/bin/heal.mjs" route .heal/config.json > .heal/route.env
          cat .heal/route.env | tee -a "$GITHUB_OUTPUT"
          . .heal/route.env
          [ -n "$unmapped" ] && echo "::notice::no self-heal route for failed job(s): $unmapped"
          if [ -z "$route" ]; then echo "::notice::nothing to heal"; exit 0; fi
          jq -r --arg r "$route" '.routes[$r] | "skill=\(.skill)\nautofix=\(.autofix | length)\nreview=\(.review.enabled)\nreview_model=\(.review.model)\nreview_turns=\(.review.max_turns)"' .heal/config.json >> "$GITHUB_OUTPUT"
          echo "tools=$(jq -r --arg r "$route" '.computed.route_tools[$r]' .heal/config.json)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Gate
        id: gate
        if: steps.route.outputs.route != ''
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          HEAD_SHA: ${{ steps.route.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          cfg=.heal/config.json
          label=$(jq -r .heal.opt_out_label $cfg)
          if echo "$LABELS" | jq -e --arg l "$label" 'index($l) != null' > /dev/null; then
            echo "::notice::self-heal skipped: opt-out label '$label'"; exit 0
          fi
          # PR policy: drafts, protected head branches, diagnose-only paths → go + outcome ceiling.
          git diff --name-only "origin/${BASE_REF}...HEAD" | jq -R . | jq -s . > .heal/pr-files.json
          export PR_INFO=$(jq -n --argjson draft "${DRAFT:-false}" --arg headRef "$HEAD_REF" --slurpfile f .heal/pr-files.json \
            '{draft: $draft, headRef: $headRef, files: $f[0]}')
          node "$KIT/bin/heal.mjs" policy $cfg > .heal/policy.json
          if [ "$(jq -r .go .heal/policy.json)" != true ]; then
            echo "::notice::self-heal skipped: $(jq -r .reason .heal/policy.json)"; exit 0
          fi
          if [ "$(jq -r --arg r "$ROUTE" '.routes[$r].commands | length' $cfg)" = 0 ]; then
            echo "::warning::route '$ROUTE' has no commands configured"; exit 0
          fi
          git log --format=%B "origin/${BASE_REF}..HEAD" > .heal/commits.txt
          gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --slurp > .heal/comments.json
          node "$KIT/bin/heal.mjs" budget $cfg "$ROUTE" "$HEAD_SHA" .heal/commits.txt .heal/comments.json > .heal/budget.json
          reason=$(jq -r .reason .heal/budget.json)
          if [ "$(jq -r .go .heal/budget.json)" != true ]; then
            echo "::notice::self-heal skipped: $reason"
            [ "$(jq -r .notify .heal/budget.json)" = true ] && gh pr comment "$PR" --body "🩹 Self-heal skipped: $reason"
            exit 0
          fi
          echo "pushes=$(jq -r .pushes .heal/budget.json)" >> "$GITHUB_OUTPUT"
          echo "ceiling=$(jq -r .ceiling .heal/policy.json),$(jq -r .ceiling .heal/budget.json)" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go && fromJSON(steps.cfg.outputs.json).runtime.node != ''
        with:
          node-version: ${{ fromJSON(steps.cfg.outputs.json).runtime.node }}
          cache: ${{ fromJSON(steps.cfg.outputs.json).runtime.node_cache }}

      - name: Runtime setup
        if: steps.gate.outputs.go
        run: |
          mapfile -t cmds < <(jq -r '.runtime.setup[]' .heal/config.json)
          for c in "${cmds[@]}"; do echo "\$ $c"; bash -c "$c"; done

      - name: Reproduce
        id: repro
        if: steps.gate.outputs.go
        env:
          # Outside the workspace: agents can only write inside it.
          SELF_HEAL_BASELINE: ${{ runner.temp }}/self-heal-baseline.z
          FINGERPRINT: ${{ runner.temp }}/self-heal-fingerprint
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          if bash "$KIT/bin/run-commands.sh" .heal/config.json ".routes.$ROUTE" .heal/failure.log; then
            echo "norepro=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --porcelain=v1 -z --untracked-files=all | tr '\0' '\n' | cut -c4- | tr '\n' '\0' > "$SELF_HEAL_BASELINE"
          jq -n --slurpfile c .heal/config.json --arg route "$ROUTE" \
            --arg pr "$PR" --arg title "$PR_TITLE" --arg base "$BASE_REF" --arg head "$HEAD_REF" '
            { route: $route, pr: ($pr|tonumber), title: $title, base: $base, head: $head,
              diff_command: "git diff origin/\($base)...HEAD",
              commands: $c[0].routes[$route].commands,
              method_skills: $c[0].agent.method_skills,
              context_files: [$c[0].agent.context_files[] | ".self-heal-policy/\(.)"] }' > .heal/context.json
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Report no repro
        if: steps.repro.outputs.norepro
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- self-heal:run route=${{ steps.route.outputs.route }} head=${{ steps.route.outputs.head }} action=no-repro run=${{ github.run_id }} -->"
        run: |
          gh pr comment "$PR" --body "🩹 \`$ROUTE\` failed in CI but passes on re-run — likely flaky or a transient environment issue. Not auto-fixing. ([run]($RUN_URL))
          $MARKER"

      - name: Autofix (deterministic, no agent)
        id: autofix
        if: steps.repro.outputs.go && steps.route.outputs.autofix != '0'
        env:
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          mapfile -t cmds < <(jq -r --arg r "$ROUTE" '.routes[$r].autofix[]' .heal/config.json)
          for c in "${cmds[@]}"; do echo "\$ $c"; bash -c "$c" || echo "::warning::autofix '$c' exited $?"; done
          if bash "$KIT/bin/run-commands.sh" .heal/config.json ".routes.$ROUTE" .heal/autofix-verify.log; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            jq -n '{classification: "autofix", fixed: true, confidence: "high", root_cause: "fixed by the deterministic autofix commands of this route"}' > .heal/result.json
            { echo "**Classification:** autofix (deterministic, no agent)"; echo; echo "Ran:"; printf -- '- `%s`\n' "${cmds[@]}"; } > .heal/summary.md
          else
            echo "::notice::autofix did not make $ROUTE green; the agent starts from the autofixed tree"
          fi

      - name: Fix (${{ steps.route.outputs.skill }})
        if: steps.repro.outputs.go && steps.autofix.outputs.fixed != 'true' && steps.route.outputs.skill != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: ${{ fromJSON(steps.cfg.outputs.json).computed.marketplaces }}
          plugins: ${{ fromJSON(steps.cfg.outputs.json).computed.plugins }}
          prompt: |
            Invoke the `${{ steps.route.outputs.skill }}` skill and follow it exactly.
            Inputs are in .heal/ — start with .heal/context.json and .heal/failure.log.
          claude_args: >-
            --plugin-dir ${{ env.KIT }}/plugin/self-heal
            --model ${{ fromJSON(steps.cfg.outputs.json).agent.model }}
            --max-turns ${{ fromJSON(steps.cfg.outputs.json).agent.max_turns }}
            --allowedTools "${{ steps.route.outputs.tools }}"

      - name: Guard
        id: guard
        if: steps.repro.outputs.go
        continue-on-error: true
        env:
          # Outside the workspace: agents can only write inside it.
          SELF_HEAL_BASELINE: ${{ runner.temp }}/self-heal-baseline.z
          FINGERPRINT: ${{ runner.temp }}/self-heal-fingerprint
          ROUTE: ${{ steps.route.outputs.route }}
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
        run: |
          # The fixer can write anywhere in the workspace: re-establish everything this step trusts.
          printf '%s' "$CONFIG_JSON" > .heal/config.json
          if [ -n "$(git -C .self-heal-policy status --porcelain --untracked-files=all)" ]; then
            git -C .self-heal-policy reset -q --hard && git -C .self-heal-policy clean -fdxq
            echo "::error::self-heal guard: the agent modified the policy checkout"; exit 1
          fi
          # claude-code-action restores .claude/ from the base branch for untrusted PR heads; undo it.
          git checkout HEAD -- .claude 2>/dev/null || true
          git clean -fdq -- .claude 2>/dev/null || true
          node "$KIT/bin/guard.mjs" "$ROUTE" .heal/config.json > .heal/changed.txt
          echo "changed:"; cat .heal/changed.txt
          bash "$KIT/bin/run-commands.sh" .heal/config.json ".routes.$ROUTE" .heal/verify.log
          { git diff; git ls-files -o --exclude-standard -z | xargs -0r sha256sum; } | sha256sum > "$FINGERPRINT"
          rm -f .heal/verdict.json .heal/decision.json   # only the judge may write a verdict, and only after this

      - name: Review (self-heal:review-fix)
        id: review
        if: steps.guard.outcome == 'success' && steps.route.outputs.review == 'true' && steps.autofix.outputs.fixed != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Invoke the `self-heal:review-fix` skill. Route: ${{ steps.route.outputs.route }}. PR base: origin/${{ github.base_ref }}.
            Judge the uncommitted working-tree changes. Write only .heal/verdict.json.
          claude_args: >-
            --plugin-dir ${{ env.KIT }}/plugin/self-heal
            --model ${{ steps.route.outputs.review_model }}
            --max-turns ${{ steps.route.outputs.review_turns }}
            --allowedTools "${{ fromJSON(steps.cfg.outputs.json).computed.review_tools }}"

      - name: Decide
        id: decide
        if: steps.repro.outputs.go
        env:
          # Outside the workspace: agents can only write inside it.
          SELF_HEAL_BASELINE: ${{ runner.temp }}/self-heal-baseline.z
          FINGERPRINT: ${{ runner.temp }}/self-heal-fingerprint
          ROUTE: ${{ steps.route.outputs.route }}
          GUARD_OK: ${{ steps.guard.outcome == 'success' }}
          REVIEW_OK: ${{ steps.review.outcome == 'success' }}
          CEILING: ${{ steps.gate.outputs.ceiling }}
          AUTOFIXED: ${{ steps.autofix.outputs.fixed == 'true' }}
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
        run: |
          printf '%s' "$CONFIG_JSON" > .heal/config.json
          POLICY_CLEAN=true
          if [ -n "$(git -C .self-heal-policy status --porcelain --untracked-files=all)" ]; then
            POLICY_CLEAN=false
            git -C .self-heal-policy reset -q --hard && git -C .self-heal-policy clean -fdxq
          fi
          [ "$REVIEW_OK" = true ] || rm -f .heal/verdict.json   # a crashed judge never counts as approval
          git checkout HEAD -- .claude 2>/dev/null || true; git clean -fdq -- .claude 2>/dev/null || true
          REVIEW_UNTAMPERED=false
          if [ "$POLICY_CLEAN" = true ] && [ -f "$FINGERPRINT" ] && { git diff; git ls-files -o --exclude-standard -z | xargs -0r sha256sum; } | sha256sum | diff -q - "$FINGERPRINT" > /dev/null; then
            REVIEW_UNTAMPERED=true
          fi
          export REVIEW_UNTAMPERED
          node "$KIT/bin/heal.mjs" decide .heal/config.json "$ROUTE" .heal | tee -a "$GITHUB_OUTPUT"
          jq . .heal/decision.json

      - name: Package fix
        if: steps.decide.outputs.action == 'auto' || steps.decide.outputs.action == 'propose'
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          HEAD_SHA: ${{ steps.route.outputs.head }}
        run: |
          tr '\n' '\0' < .heal/changed.txt | xargs -0 git add -A --
          git diff --cached --binary > .heal/fix.patch
          jq -n --arg route "$ROUTE" --arg head "$HEAD_SHA" --arg run "${{ github.run_id }}" --arg pr "$PR" \
            '{route: $route, head: $head, run: $run, pr: ($pr|tonumber)}' > .heal/meta.json
          {
            echo "fix: self-heal $ROUTE ($(jq -r '.classification' .heal/result.json))"
            echo
            head -c 4000 .heal/summary.md 2>/dev/null || true
            echo
            echo "Self-Heal: $ROUTE"
            echo "Run: $RUN_URL"
          } > .heal/commit-msg

      - name: Upload fix
        if: steps.decide.outputs.action == 'auto' || steps.decide.outputs.action == 'propose'
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-patch
          retention-days: 14
          include-hidden-files: true   # every path is under .heal/ (explicit list, nothing else leaks)
          path: |
            .heal/fix.patch
            .heal/meta.json
            .heal/commit-msg
            .heal/result.json
            .heal/verdict.json
            .heal/decision.json

      - name: Push token
        id: app
        if: steps.decide.outputs.action == 'auto' && vars.SELF_HEAL_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SELF_HEAL_APP_ID }}
          private-key: ${{ secrets.SELF_HEAL_APP_PRIVATE_KEY }}

      - name: Publish fix (auto-apply)
        if: steps.decide.outputs.action == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app.outputs.token || secrets.SELF_HEAL_TOKEN || github.token }}
          ROUTE: ${{ steps.route.outputs.route }}
          PUSHES: ${{ steps.gate.outputs.pushes }}
          MAX: ${{ fromJSON(steps.cfg.outputs.json).heal.max_attempts }}
          MARKER: "<!-- self-heal:run route=${{ steps.route.outputs.route }} head=${{ steps.route.outputs.head }} action=auto run=${{ github.run_id }} -->"
        run: |
          git config user.name "self-heal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F .heal/commit-msg
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$HEAD_REF"
          {
            echo "🩹 **Self-heal pushed a fix** for \`$ROUTE\` (fix $((PUSHES + 1))/$MAX) — auto-applied: $(jq -r '.reasons | join("; ")' .heal/decision.json). Please review the commit; \`/heal revert\` undoes it."
            echo; sed 's/<!--/\&lt;!--/g' .heal/summary.md 2>/dev/null || true
            if [ -f .heal/verdict.json ]; then
              echo; echo "**Independent review:** $(jq -r '"\(.verdict) (\(.confidence))"' .heal/verdict.json)"
              jq -r '.risks[]? | "- ⚠️ \(.)"' .heal/verdict.json | sed 's/<!--/\&lt;!--/g'
            fi
            [ "${{ steps.app.outputs.token != '' || secrets.SELF_HEAL_TOKEN != '' }}" = true ] \
              || { echo; echo "_CI will not re-run on this push (pushed with GITHUB_TOKEN). Configure a self-heal GitHub App or \`SELF_HEAL_TOKEN\`._"; }
            echo; echo "$MARKER"
          } | gh pr comment "$PR" --body-file -

      - name: Propose fix
        if: steps.decide.outputs.action == 'propose'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.route.outputs.route }}
          DEFERRED: ${{ steps.route.outputs.deferred }}
          MARKER: "<!-- self-heal:run route=${{ steps.route.outputs.route }} head=${{ steps.route.outputs.head }} action=propose run=${{ github.run_id }} -->"
        run: |
          lines=$(wc -l < .heal/fix.patch)
          {
            echo "🩹 **Self-heal proposes a fix** for \`$ROUTE\` — not applied. ([run]($RUN_URL))"
            echo; echo "_Not auto-applied: $(jq -r '.reasons | join("; ")' .heal/decision.json | sed 's/<!--/\&lt;!--/g')._"
            echo; sed 's/<!--/\&lt;!--/g' .heal/summary.md 2>/dev/null || true
            if [ -f .heal/verdict.json ]; then
              echo; echo "**Independent review:** $(jq -r '"\(.verdict) (\(.confidence))"' .heal/verdict.json)"
              jq -r '.risks[]? | "- ⚠️ \(.)"' .heal/verdict.json | sed 's/<!--/\&lt;!--/g'
            fi
            echo; echo "<details><summary>Patch ($(wc -l < .heal/changed.txt) file(s), $lines lines)</summary>"
            echo; echo '~~~diff'; head -n 300 .heal/fix.patch | head -c 40000 | sed 's/<!--/\&lt;!--/g'
            [ "$lines" -gt 300 ] && echo "… truncated — download the artifact for the full patch"
            echo '~~~'; echo; echo '</details>'
            echo
            echo "**Apply:** comment \`/heal apply\` · **Reject:** \`/heal reject <why>\` (both need write access) · or locally:"
            echo '```sh'
            echo "gh run download ${{ github.run_id }} -R ${{ github.repository }} -n self-heal-patch -D .heal/proposal && git apply .heal/proposal/fix.patch"
            echo '```'
            [ -n "$DEFERRED" ] && { echo; echo "_Also failing: \`$DEFERRED\` — handled once this one is green._"; }
            echo; echo "$MARKER"
          } | gh pr comment "$PR" --body-file -

      - name: Report diagnosis
        if: always() && steps.repro.outputs.go && steps.decide.outputs.action != 'auto' && steps.decide.outputs.action != 'propose'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.route.outputs.route }}
          MARKER: "<!-- self-heal:run route=${{ steps.route.outputs.route }} head=${{ steps.route.outputs.head }} action=diagnose run=${{ github.run_id }} -->"
        run: |
          {
            echo "🩹 **Self-heal did not offer a fix** for \`$ROUTE\`. ([run]($RUN_URL))"
            if [ -f .heal/decision.json ]; then jq -r '.reasons[] | "- \(.)"' .heal/decision.json | sed 's/<!--/\&lt;!--/g'; else echo "- the pipeline failed before a decision"; fi
            echo; echo "**Diagnosis:**"; sed 's/<!--/\&lt;!--/g' .heal/summary.md 2>/dev/null || echo "_none produced_"
            echo; echo "$MARKER"
          } | gh pr comment "$PR" --body-file -

      - name: Summary
        if: always() && steps.route.outputs.route != ''
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          DEFERRED: ${{ steps.route.outputs.deferred }}
          UNMAPPED: ${{ steps.route.outputs.unmapped }}
        run: |
          j() { [ -f "$1" ] && jq -c . "$1" | sed 's/|/\\|/g' || echo "—"; }
          {
            echo "## 🩹 self-heal: \`$ROUTE\`"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Route | \`$ROUTE\` · deferred: ${DEFERRED:-—} · unmapped: ${UNMAPPED:-—} |"
            echo "| PR policy | \`$(j .heal/policy.json)\` |"
            echo "| Budget | \`$(j .heal/budget.json)\` |"
            echo "| Autofix | ${{ steps.autofix.outputs.fixed == 'true' && 'made it green' || (steps.route.outputs.autofix != '0' && 'did not help' || 'not configured') }} |"
            echo "| Fixer | \`$(jq -c '{classification, fixed, confidence}' .heal/result.json 2>/dev/null || echo —)\` |"
            echo "| Guard + verify | ${{ steps.guard.outcome || 'not run' }} |"
            echo "| Review | \`$(jq -c '{verdict, confidence}' .heal/verdict.json 2>/dev/null || echo —)\` |"
            echo "| **Decision** | \`$(j .heal/decision.json)\` |"
            echo
            echo "<details><summary>Effective route config</summary>"
            echo; echo '```json'; jq --arg r "$ROUTE" '.routes[$r]' .heal/config.json; echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
