name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  # Not routed to a healer: the kit's guardrails are fixed by humans only.
  kit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tools/self-heal/test/*.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  # Self-healing (tools/self-heal): one entry point for every job above; config in
  # .github/self-heal/config.yml routes each failed job to its healer.
  heal:
    needs: [unit-tests, build, lint]
    if: failure() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/self-heal.yml
    with:
      needs: ${{ toJSON(needs) }}
    secrets: inherit
