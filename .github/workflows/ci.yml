name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test --if-present
      - run: npm run typecheck --if-present
      - name: Self-heal kit tests
        run: node --test tools/self-heal/test/*.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  # Self-healing (tools/self-heal): config in .github/self-heal/config.yml.
  heal-tests:
    needs: unit-tests
    if: failure() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/self-heal-tests.yml
    secrets: inherit
