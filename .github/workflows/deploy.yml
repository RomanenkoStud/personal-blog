name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      migrate: ${{ steps.migrate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: npm run build

      - name: Run D1 migrations
        id: migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler d1 migrations apply blog-db --remote 2>&1 | tee migrate.log

      - name: Upload migration log
        if: failure() && steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: migrate-log
          path: migrate.log

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            RESEND_API_KEY
            GH_PROFILE_TOKEN
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}

  # Self-healing (tools/self-heal): config in .github/self-heal/config.yml.
  # Opens a PR with a fixed pending migration; never touches the remote DB.
  heal-migrations:
    needs: deploy
    if: failure() && needs.deploy.outputs.migrate == 'failure'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/self-heal-migrations.yml
    secrets: inherit
