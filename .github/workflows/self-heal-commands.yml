# PR comment commands for self-heal. issue_comment workflows always run from the default
# branch, so a PR cannot change what these commands do.
#   /heal apply [run-id]   commit the latest (or given) self-heal proposal to the PR branch
#   /heal reject <reason>  reject the latest open proposal (feedback)
#   /heal revert           revert the latest self-heal fix commit (feedback)
name: Self-heal commands

on:
  issue_comment:
    types: [created]

concurrency:
  group: self-heal-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/heal ')
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/self-heal-command.yml
    secrets: inherit
