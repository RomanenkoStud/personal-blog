name: Setup
description: Node 22, npm ci, and the glibc native binaries (rollup/sharp) the lockfile omits.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash

    - name: Install Linux glibc native binaries
      shell: bash
      run: node scripts/ci/install-native-binaries.cjs
