# Repo overlay for the self-heal kit. Merged over tools/self-heal/defaults.yml
# (see that file for every key). Loaded from the DEFAULT BRANCH at run time.

agent:
  context_files:
    - .github/self-heal/context.md
  # model: sonnet
  # plugins / method_skills: swap the borrowed debugging strategy here.

runtime:
  node: "22"            # "" to skip actions/setup-node
  setup:
    - npm ci

heal:
  # drafts: heal                 # heal | diagnose | skip
  diagnose_only_paths: []        # PRs touching these never get a patch, e.g. ['^migrations/']

guard:
  protected_paths: []   # extra regexes on top of the kit's safety floor (every route)

routes:                 # one per CI job to heal; `jobs` are the job ids passed in `needs`
  tests:
    jobs: [unit-tests]
    commands:           # exactly what that job runs; all must pass
      - npm test
    allowed_tools:      # Bash patterns for those runners
      - Bash(npm test:*)
    # apply: propose    # propose (default) | auto (commit if auto_apply rules match) | diagnose
  # lint:               # autofix-only route: no agent, deterministic fixers
  #   jobs: [lint]
  #   skill: ""
  #   commands: [npm run lint]
  #   autofix: ["npx eslint . --fix"]
  build:
    jobs: [build]
    commands:
      - npm run build
    allowed_tools:
      - Bash(npm run build:*)

migrations:
  enabled: false
  # adapter: d1
  # dir: migrations
  # allowed_tools: ["Bash(npx wrangler d1 execute <db> --local:*)"]
  # d1: { database: <db> }
