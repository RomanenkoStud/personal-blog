# self-heal core defaults. Repo overlays (.github/self-heal/config.yml) are deep-merged on top.
# Merge rules (bin/load-config.mjs):
#   - objects merge recursively, scalars and most arrays are REPLACED by the overlay
#   - "safety floor" arrays are APPENDED (an overlay can add guardrails, never remove them):
#       guard.protected_paths, guard.forbidden_patterns, guard.test_file_patterns, heal.protected_branches,
#       migrations.protected_paths
#   - every entry under `routes` is merged over `route_defaults`, so an overlay can add a
#     new route (e.g. lint) with only the keys that differ.
version: 2

agent:
  model: sonnet
  max_turns: 30
  # Borrowed strategy: community-maintained skill packs, installed per run.
  # Swap or add packs here; no workflow edits needed. Plugin ids are <plugin>@<marketplace>.
  marketplaces:
    - https://github.com/anthropics/claude-plugins-official.git
  plugins:
    - mattpocock-skills@claude-plugins-official
  # Skills the healer must load before working (namespaced <plugin>:<skill>).
  method_skills:
    - mattpocock-skills:diagnosing-bugs
  # Repo-specific knowledge files the agents read first. Repo-relative paths that must live
  # under the policy dir (.github/self-heal/) — they are read from the trusted default branch.
  context_files: []
  # Tools every self-heal agent gets. Bash is allowlisted per pattern only.
  base_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Bash(git diff:*)
    - Bash(git log:*)
    - Bash(git show:*)
    - Bash(git status:*)
    - Bash(ls:*)

runtime:
  node: ""            # e.g. "22" → actions/setup-node
  node_cache: npm     # npm | pnpm | yarn | "" (setup-node cache)
  setup: []           # shell commands run after checkout (install deps etc.)

# PR healing: one entry point (workflows/self-heal.yml) for every failing CI job.
heal:
  # Deterministic router: the caller passes toJSON(needs); a failed job is mapped to the
  # route whose `jobs` list contains it. One route is healed per run, first in this order;
  # the rest are healed on the next CI run (after the fix lands) or reported.
  priority: [tests, build]
  opt_out_label: no-self-heal
  max_attempts: 2     # fix commits per branch (auto-applied + /heal apply), counted by the Self-Heal trailer
  max_runs: 5         # agent runs per PR (counted by self-heal comment markers)
  drafts: heal        # draft PRs: heal | diagnose (never offer a patch) | skip
  protected_branches: # never heal a PR whose HEAD branch matches (regex)
    - '^(main|master|trunk|develop|dev|stable|canary)$'
    - '^release/'
  diagnose_only_paths: [] # regex: if the PR itself touches a match, fixes are never offered (e.g. '^migrations/')

# Safety floor for every code route. A violation discards the fix.
guard:
  test_file_patterns: # regex on paths that are tests (deleting one is a violation)
    - '\.(test|spec)\.[cm]?[jt]sx?$'
    - '(^|/)(__)?tests?(__)?/'
  protected_paths:    # regex on repo-relative paths a fixer must not touch
    - '^\.github/'
    - '^\.claude/'
    - '^tools/self-heal/'
    - '(^|/)package(-lock)?\.json$'
    - '(^|/)(pnpm-lock\.yaml|yarn\.lock|bun\.lockb?)$'
  forbidden_patterns: # regex on ADDED lines: ways to fake a green check
    - '\b(it|test|describe)\.(skip|only|todo)\b'
    - '\bx(it|describe|test)\('
    - '@ts-(ignore|nocheck|expect-error)'
    - 'eslint-disable'

# Keys every route gets unless it overrides them.
route_defaults:
  enabled: true
  jobs: []            # CI job ids (keys of `needs`) this route heals
  skill: ""           # contract skill the fixer follows, e.g. self-heal:heal-tests ("" = autofix-only route, no agent)
  commands: []        # all must pass, in order — the route's red/green signal
  allowed_tools: []   # extra tools for the fixer, e.g. "Bash(npx vitest:*)"
  protected_paths: [] # extra regexes on top of guard.protected_paths
  # What happens to a fix that passed guard + re-verification + review:
  #   propose  — PR comment with diff + `/heal apply` (default; a human decides)
  #   auto     — commit to the PR branch IF auto_apply rules match, otherwise propose
  #   diagnose — never offer a patch, only the diagnosis
  apply: propose
  # Deterministic fixers run BEFORE any agent (Nx: format/sync/conformance preset), e.g.
  # ["npx eslint . --fix", "npx prettier --write ."]. If `commands` then pass, the agent is
  # skipped entirely; otherwise the agent starts from the autofixed tree.
  autofix: []
  autofix_apply: auto # what a successful autofix gets: auto | propose | diagnose (guard still applies)
  auto_apply:
    classifications: [code-regression]
    min_confidence: high   # both the fixer's and the judge's confidence must reach this
  review:
    enabled: true     # independent read-only judge; auto-apply is impossible without it
    model: sonnet
    max_turns: 15

routes:
  tests:
    jobs: [unit-tests]
    skill: self-heal:heal-tests
  build:
    jobs: [build]
    skill: self-heal:heal-build

migrations:
  enabled: false
  adapter: ""         # one of tools/self-heal/adapters/* (e.g. d1)
  dir: migrations
  allowed_tools: []
  protected_paths: []
  review:
    enabled: true
    model: sonnet
    max_turns: 15
  pr_label: self-heal-migrations
  d1:
    database: ""
